<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>%BRAND_NAME% — %BRAND_TAGLINE%</title>
    <meta name="description" content="%BRAND_DESCRIPTION%" />
    <meta name="author" content="%BRAND_CREATOR%" />
    <meta name="generator" content="%BRAND_SIGNATURE%" />
    <meta name="theme-color" content="%BRAND_THEME_COLOR%" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="%BRAND_SITE_URL%/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%BRAND_NAME%" />
    <meta property="og:title" content="%BRAND_NAME%" />
    <meta property="og:description" content="%BRAND_DESCRIPTION%" />
    <meta property="og:url" content="%BRAND_SITE_URL%/" />
    <meta property="og:image" content="%BRAND_SITE_URL%/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%BRAND_NAME%" />
    <meta name="twitter:description" content="%BRAND_DESCRIPTION%" />
    <meta name="twitter:image" content="%BRAND_SITE_URL%/brand/og-image.png" />

    <script src="/theme-init.js"></script>
    <style>
      .ea-boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#070914}
      .ea-boot svg{filter:drop-shadow(0 0 18px rgba(47,123,255,.55));animation:ea-boot 1.6s ease-in-out infinite}
      @keyframes ea-boot{50%{opacity:.55;transform:scale(.94)}}
      @media (prefers-reduced-motion:reduce){.ea-boot svg{animation:none}}
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Branded boot screen shown until React mounts (replaced on first render). -->
      <div class="ea-boot" role="status" aria-label="Chargement d'Euloge Arcade">
        <svg viewBox="0 0 64 64" width="72" height="72" aria-hidden="true">
          <defs>
            <linearGradient id="boot-g" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#38E1FF" /><stop offset=".5" stop-color="#2F7BFF" /><stop offset="1" stop-color="#A24DFF" />
            </linearGradient>
          </defs>
          <path d="M15 3.5H60.5V49L49 60.5H3.5V15Z" fill="#0E1226" stroke="url(#boot-g)" stroke-width="2.5" stroke-linejoin="round" />
          <path d="M17 14H47L43 20.5H24V43.5H43L47 50H17Z" fill="url(#boot-g)" />
          <path d="M28 28.75H43.5L40 35.25H28Z" fill="url(#boot-g)" />
        </svg>
      </div>
    </div>
    <noscript>%BRAND_NAME% nécessite JavaScript pour fonctionner.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
