<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <!-- Marker checked by the Euloge Arcade GamePlayer -->
    <meta name="euloge-arcade-game" content="arcade-suite" />
    <title>Euloge Arcade — Console Holo-Cartouche</title>
    <style>
      :root {
        --bg: #060813;
        --surface: #0d1124;
        --surface-2: #161d3a;
        --ink: #eef2ff;
        --muted: #9aa6cf;
        --accent: #2f7bff;
        --accent-2: #a24dff;
        --accent-3: #38e1ff;
        --success: #34d399;
        --warning: #fbbf24;
        --danger: #fb4c6e;
      }
      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at 50% 15%, #111938 0%, #060813 75%);
        color: var(--ink);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #app {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }
      .hud-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 14px;
        background: rgba(13, 17, 36, 0.88);
        border-bottom: 1px solid rgba(56, 225, 255, 0.2);
        backdrop-filter: blur(10px);
        z-index: 10;
        flex-shrink: 0;
      }
      .hud-left,
      .hud-right {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .badge {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 6px;
        background: rgba(56, 225, 255, 0.12);
        color: var(--accent-3);
        border: 1px solid rgba(56, 225, 255, 0.3);
      }
      .title {
        font-weight: 800;
        font-size: 14px;
        color: var(--ink);
        max-width: 240px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .stat-pill {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 8px;
        background: rgba(22, 29, 58, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .stat-pill strong {
        color: var(--accent-3);
      }
      .hud-btn {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(22, 29, 58, 0.85);
        color: var(--ink);
        font-size: 11px;
        font-weight: 700;
        padding: 5px 10px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .hud-btn:hover {
        border-color: var(--accent-3);
        background: rgba(47, 123, 255, 0.25);
      }
      .hud-btn.primary {
        background: linear-gradient(135deg, var(--accent-3), var(--accent), var(--accent-2));
        border: none;
        color: #fff;
      }
      #stage-wrap {
        position: relative;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        border-radius: 12px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(56, 225, 255, 0.18);
        background: #070a18;
        touch-action: none;
      }
      #dom-layer {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        overflow: auto;
      }
      #touch-pad {
        position: absolute;
        inset: auto 12px 12px 12px;
        display: none;
        justify-content: space-between;
        align-items: flex-end;
        pointer-events: none;
        z-index: 15;
      }
      .pad-cluster {
        display: flex;
        gap: 6px;
        pointer-events: auto;
      }
      .pad-btn {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        border: 1px solid rgba(56, 225, 255, 0.35);
        background: rgba(13, 17, 36, 0.78);
        color: var(--ink);
        font-weight: 800;
        font-size: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(6px);
      }
      .pad-btn:active {
        background: rgba(56, 225, 255, 0.35);
      }
      @media (pointer: coarse), (max-width: 820px) {
        #touch-pad {
          display: flex;
        }
        .title {
          max-width: 130px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header class="hud-bar">
        <div class="hud-left">
          <span id="hud-code" class="badge">EA-ARC</span>
          <span id="hud-title" class="title">Cartouche Arcade</span>
          <span id="hud-mode" class="badge" style="color:#fbbf24;border-color:rgba(251,191,36,0.3);background:rgba(251,191,36,0.1)">CONSOLE NATIVE</span>
        </div>
        <div class="hud-right">
          <span class="stat-pill">SCORE <strong id="hud-score">0</strong></span>
          <span class="stat-pill">RECORD <strong id="hud-best">0</strong></span>
          <button type="button" id="btn-restart" class="hud-btn">Recommencer (R)</button>
          <button type="button" id="btn-submit" class="hud-btn primary">Enregistrer le score</button>
        </div>
      </header>
      <div id="stage-wrap">
        <canvas id="game-canvas" width="960" height="560" tabindex="0" aria-label="Surface de jeu interactive"></canvas>
        <div id="dom-layer"></div>
        <div id="touch-pad">
          <div class="pad-cluster">
            <button type="button" class="pad-btn" data-key="ArrowLeft" aria-label="Gauche">←</button>
            <button type="button" class="pad-btn" data-key="ArrowUp" aria-label="Haut">↑</button>
            <button type="button" class="pad-btn" data-key="ArrowDown" aria-label="Bas">↓</button>
            <button type="button" class="pad-btn" data-key="ArrowRight" aria-label="Droite">→</button>
          </div>
          <div class="pad-cluster">
            <button type="button" class="pad-btn" data-key=" " aria-label="Action A">A</button>
            <button type="button" class="pad-btn" data-key="KeyJ" aria-label="Action B">B</button>
          </div>
        </div>
      </div>
    </div>
    <script src="/games/arcade-suite/engine.js"></script>
  </body>
</html>
